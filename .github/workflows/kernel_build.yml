name: Build Rescue Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-core build-essential bc bison flex libssl-dev libelf-dev python3 git wget

      - name: Setup Clang Toolchain
        run: |
          git clone https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b --depth=1 clang
          git clone https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 --depth=1 gcc
          git clone https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 --depth=1 gcc32

      - name: Build Kernel
        run: |
          export PATH=$PWD/clang/bin:$PWD/gcc/bin:$PWD/gcc32/bin:$PATH
          mkdir -p out
          
          # Use the instantnoodle (OnePlus 8) defconfig
          make O=out ARCH=arm64 vendor/instantnoodle_defconfig

          # Compile kernel with LLVM/Clang
          make O=out ARCH=arm64 CC=clang \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi- \
            LLVM=1 LLVM_IAS=1 -j$(nproc)

      - name: Upload Built Boot/Image
        uses: actions/upload-artifact@v4
        with:
          name: compiled-kernel-image
          path: out/arch/arm64/boot/Image.gz-dtb
