name: Build ARM64 Android Kernel

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Maximize build space and allocate swap
        uses: easimon/maximize-build-space@master
        with:
          swap-size-mb: 8192
          root-reserve-mb: 4096
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-docker-images: 'true'
          
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git bc bison build-essential ccache curl flex g++-multilib gcc-multilib gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3
          
      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          max-size: "5G"
          
      - name: Setup Toolchain Cache
        id: cache-toolchain
        uses: actions/cache@v3
        with:
          path: clang
          key: ${{ runner.os }}-aosp-clang-r416183b
          
      - name: Download AOSP Clang Toolchain
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          # Use a mirrored AOSP Clang repository to avoid the massive size of the main AOSP repo
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b.git clang

      - name: Set Toolchain Path
        run: echo "CLANG_DIR=$GITHUB_WORKSPACE/clang" >> $GITHUB_ENV

      - name: Build Kernel
        env:
          CCACHE_COMPILERCHECK: "%compiler% -dumpversion"
          CCACHE_NOHASHDIR: "true"
          CCACHE_HARDLINK: "true"
        run: |
          # Use the provided build.sh if it exists, otherwise use standard make commands
          export PATH="${CLANG_DIR}/bin:/usr/lib/ccache:${PATH}"
          
          if [ -f "build.sh" ]; then
            chmod +x build.sh
            ./build.sh
          else
            export ARCH=arm64
            export SUBARCH=arm64
            export CC="ccache clang"
            export LLVM=1
            export LLVM_IAS=1
            export CROSS_COMPILE=aarch64-linux-gnu-
            export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
            
            make O=out clean
            make O=out mrproper
            make O=out blu_spark_defconfig
            
            # Disable Trusted Keys for standard custom kernels to prevent OpenSSL signature errors
            ./scripts/config --file out/.config -d CONFIG_SYSTEM_TRUSTED_KEYRING
            ./scripts/config --file out/.config -d CONFIG_SYSTEM_EXTRA_CERTIFICATE
            make O=out olddefconfig
            
            make -j$(nproc --all) O=out
          fi

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-artifacts
          path: |
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/Image.gz
            out/arch/arm64/boot/Image.gz-dtb
            out/arch/arm64/boot/dts/**/*.dtb
            out/arch/arm64/boot/dtbo.img
            # If AnyKernel3 produces a flashable zip in the root directory, it will be uploaded as well
            *.zip
          if-no-files-found: warn
