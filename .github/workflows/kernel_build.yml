name: Build OnePlus 8 Rescue Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4

      - name: Install Build Environment Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bc bison flex libssl-dev libelf-dev \
            python3 git wget curl zip libncurses-dev ccache

      - name: Setup Clang Toolchain (AOSP/Lineage Clang)
        run: |
          mkdir -p toolchain/clang toolchain/gcc64 toolchain/gcc32
          
          # Pulling reliable prebuilts matching modern AOSP/Lineage standards
          git clone https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b --depth=1 toolchain/clang
          git clone https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 --depth=1 toolchain/gcc64
          git clone https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 --depth=1 toolchain/gcc32

      - name: Configure and Compile Kernel
        run: |
          # Set up environment PATH
          export PATH=$PWD/toolchain/clang/bin:$PWD/toolchain/gcc64/bin:$PWD/toolchain/gcc32/bin:$PATH
          
          mkdir -p out

          # Strip hardcoded absolute paths out of any defconfig files
          find arch/arm64/configs -name "*defconfig" -exec sed -i '/CONFIG_CROSS_COMPILE/d' {} +

          # Generate .config and explicitly override the cross-compiler variables via environment variables
          make O=out ARCH=arm64 \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi- \
            CONFIG_CROSS_COMPILE="" \
            vendor/instantnoodle_defconfig

          # Compile using Clang with full LLVM integrated assembler flags
          make O=out ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi- \
            LLVM=1 \
            LLVM_IAS=1 \
            -j$(nproc)

      - name: Archive Built Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: instantnoodle-rescue-boot-image
          path: out/arch/arm64/boot/Image.gz-dtb
